name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (CPU torch)
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: python-for-ai-infra
        working-directory: python-for-ai-infra
        run: for f in */*.py; do echo "== $f"; python "$f"; done
      - name: transformer-and-llm
        working-directory: transformer-and-llm
        run: |
          # scaling_law_fit / training_recipe_lab / bpe_from_scratch train small models: --quick keeps them to ~1 min each
          for f in *.py; do
            echo "== $f"
            case "$f" in
              scaling_law_fit.py|training_recipe_lab.py|bpe_from_scratch.py) python "$f" --quick > /tmp/out.txt ;;
              *) python "$f" > /tmp/out.txt ;;
            esac || { cat /tmp/out.txt; exit 1; }
          done
          python tools/gen_patch_merge_svg.py /tmp/patch.svg
          python tools/gen_scaling_svg.py /tmp/scaling.svg
          python tools/gen_schedule_svg.py /tmp/schedule.svg
      # post-training/ is not run in CI: it downloads Qwen2.5-0.5B (~1 GB) and fine-tunes it; see its README.
      - name: deep-learning-foundations (--quick)
        working-directory: deep-learning-foundations
        run: |
          for f in 0*.py; do echo "== $f"; python "$f" --quick; done
      - name: coding-interview (python + ai)
        working-directory: coding-interview
        run: |
          python -m unittest discover -s python -p 'p*.py'
          for f in ai/*.py; do echo "== $f"; python "$f" --check; done

  cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: build and run
        working-directory: cpp-for-ai-infra
        run: |
          make -j
          make run
          make ex04 2>&1 | grep -q "error" && echo "ex04 fails to compile as intended"
      - name: coding-interview infra (python + c++)
        working-directory: coding-interview/infra
        run: make run

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: coding-interview java
        working-directory: coding-interview/java
        run: make test JAVA_HOME=$JAVA_HOME
